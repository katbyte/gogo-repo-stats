# Migrated from the v1 config by hand: the same linters this repo always ran, minus the ones
# golangci-lint v2 removed or folded into staticcheck (deadcode, structcheck, varcheck,
# exportloopref, gosimple, typecheck, vet, vetshadow).
version: "2"

run:
  timeout: 10m
  modules-download-mode: vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - asciicheck
    - errcheck
    - gocritic
    - godot
    - govet
    - ineffassign
    - nakedret
    - misspell
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    misspell:
      locale: "UK"
      ignore-rules: # go-echarts and gookit API names
        - "color"
        - "colors"
        - "center"
        - "labeled" # github timeline event name

formatters:
  enable:
    - gofmt
    - goimports
